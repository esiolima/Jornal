<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Jornal | Painel de Controle</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary: #1F3C6E;
      --accent: #E0B84B;
      --bg: #f4f7f9;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      margin: 0;
      color: #333;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 60px 20px;
      text-align: center;
      border-bottom: 5px solid var(--accent);
    }
    .container-ui {
      max-width: 900px;
      margin: -40px auto 40px;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    .file-drop {
      border: 2px dashed #ccc;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    .file-drop:hover {
      border-color: var(--primary);
    }
    button {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      background: #d4ae46;
    }
    #jornal {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 40px;
    }
    .card-wrapper {
      width: 350px; /* Miniatura para visualização */
      height: 529px;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .card-iframe {
      width: 700px;
      height: 1058px;
      border: none;
      transform: scale(0.5);
      transform-origin: top left;
    }
    .btn-export {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 40px;
      background: #1a7d00;
      color: white;
    }
    .btn-export:hover {
      background: #145e00;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gerador de Jornal de Ofertas</h1>
    <p>Transforme sua planilha em encartes profissionais instantaneamente</p>
  </header>

  <div class="container-ui">
    <div class="file-drop">
      <p>Arraste sua planilha aqui ou clique para selecionar</p>
      <input type="file" id="upload" accept=".xlsx" />
    </div>
    <button onclick="processarPlanilha()">🚀 GERAR ENCARTES</button>
  </div>

  <div id="jornal"></div>

  <!-- Bibliotecas Necessárias -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
