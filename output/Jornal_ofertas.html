<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornal de Ofertas - 3 Colunas</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Container geral para os cards */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); /* Responsivo */
      gap: 20px; /* Espaçamento entre os cards */
      padding: 20px;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background-color: #ffffff;
      border: 10px solid #e0b84b; /* Borda dourada */
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    /* Imagem do card */
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Título do card */
    .card h3 {
      font-size: 22px;
      margin-top: 10px;
      color: #333;
    }

    /* Descrição */
    .card p {
      font-size: 16px;
      color: #666;
      margin: 10px 0;
    }

    /* Preço ou destaque */
    .card .price {
      font-size: 20px;
      color: #1a7d00;
      font-weight: bold;
    }

    /* Efeito de hover */
    .card:hover {
      transform: translateY(-10px); /* Eleva o card ao passar o mouse */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Produto 1">
      <h3>Produto 1</h3>
      <p>Descrição do produto 1</p>
      <div class="price">R$ 99,90</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Produto 2">
      <h3>Produto 2</h3>
      <p>Descrição do produto 2</p>
      <div class="price">R$ 119,90</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Produto 3">
      <h3>Produto 3</h3>
      <p>Descrição do produto 3</p>
      <div class="price">R$ 89,90</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Produto 4">
      <h3>Produto 4</h3>
      <p>Descrição do produto 4</p>
      <div class="price">R$ 129,90</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Produto 5">
      <h3>Produto 5</h3>
      <p>Descrição do produto 5</p>
      <div class="price">R$ 149,90</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300x200" alt="Produto 6">
      <h3>Produto 6</h3>
      <p>Descrição do produto 6</p>
      <div class="price">R$ 159,90</div>
    </div>
  </div>

</body>
</html>
