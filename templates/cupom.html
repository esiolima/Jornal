<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Cupom de Desconto</title>

<style>
* {
  box-sizing: border-box;
  font-family: Inter, sans-serif;
  text-transform: uppercase;
}

body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 700px;
  height: 1058px;
  border: 6px solid #F2C94C;
  border-radius: 48px;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  position: relative;
  color: #1F3C6E;
}

.logo img {
  max-height: 120px;
}

.condicao {
  margin: 20px 0;
  font-size: 28px;
  text-align: center;
}

.percentual {
  display: flex;
  align-items: flex-end;
}

.numero {
  font-weight: 900;
  font-size: 180px;
}

.percent {
  font-size: 60px;
}

.desconto {
  font-size: 40px;
  font-weight: bold;
}

.cupom-box {
  width: 600px;
  height: 140px;
  background: #16A7E0;
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#cupom-text {
  font-size: 90px;
  color: white;
}

/* RODAPÉ */
.rodape {
  margin-top: auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.info {
  font-size: 16px;
}
</style>
</head>

<body>
<div class="card">

  <div class="logo">
    <img src="{{LOGO}}">
  </div>

  <div class="condicao">{{TEXTO}}</div>

  <div class="percentual">
    <div class="numero" id="valor-text">{{VALOR}}</div>
    <div class="percent">%</div>
  </div>

  <div class="desconto">DE DESCONTO</div>

  <div class="cupom-box">
    <span id="cupom-text">{{CUPOM}}</span>
  </div>

  <div class="rodape" id="rodape">
    <div class="info" id="info-uf">UF: {{UF}}</div>
    <div class="info" id="info-urn">URN: {{URN}}</div>
    <div class="info" id="info-segmento">Negócio do Cliente: {{SEGMENTO}}</div>
  </div>

</div>

<script>
// AJUSTE VALOR
(function () {
  const el = document.getElementById("valor-text");
  let size = 180;
  while (el.scrollWidth > el.parentElement.clientWidth && size > 40) {
    size--;
    el.style.fontSize = size + "px";
  }
})();

// OCULTAR CAMPOS VAZIOS
function hide(id, val) {
  if (!val || val.includes("{{")) {
    document.getElementById(id).style.display = "none";
  }
}

hide("info-uf", "{{UF}}");
hide("info-urn", "{{URN}}");
hide("info-segmento", "{{SEGMENTO}}");
</script>

</body>
</html>
