<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: 'Inter'; src: url('../fonts/Inter-Bold.ttf') format('truetype'); font-weight: 700; }
  
  body { 
    margin: 0; 
    padding: 40px; 
    background: #ffffff; 
    font-family: 'Inter', sans-serif;
    width: 1200px; /* Largura fixa para 3 cards + gaps */
  }

  .jornal-container {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .categoria-secao {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .tarja-categoria {
    width: 100%;
    background: #2b4474;
    color: #ffffff;
    padding: 25px;
    font-size: 42px;
    font-weight: 900;
    text-align: center;
    border-radius: 15px;
    text-transform: uppercase;
  }

  .cards-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center; /* Centraliza 1, 2 ou 3 cards */
  }

  /* Miniatura do Card Original */
  .card-mini-wrapper {
    width: 350px; /* Tamanho do card no jornal */
    height: 529px;
    border: 4px solid #e0b84b;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: #fff;
  }

  iframe {
    width: 700px;
    height: 1058px;
    border: none;
    transform: scale(0.5); /* Reduz de 700px para 350px */
    transform-origin: top left;
  }
</style>
</head>
<body>
  <div id="jornal-root" class="jornal-container">
    {{CONTEUDO}}
  </div>
</body>
</html>
