<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<style>
* {
  box-sizing: border-box;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  color: #1F3C6E;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 700px;
  height: 1058px;

  /* PADRÃO NOVO */
  border-radius: 40px;
  border: 10px solid #E0B84B; /* espessura padronizada */

  background-color: #ffffff;

  /* 🔥 ISSO CORRIGE O PROBLEMA DO FUNDO */
  overflow: hidden;

  padding: 60px 40px 40px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  position: relative;
}

/* CENTRO */
.texto-topo {
  font-size: 26px;
  text-align: center;
}

.valor-texto {
  font-size: 200px;
  font-weight: 900;
  text-align: center;
}

/* 🔥 RODAPÉ */
.rodape {
  text-align: center;
}

.info {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="card">

<div class="texto-topo">{{TEXTO}}</div>

<div class="valor-texto">{{VALOR}}%</div>

<div>{{COMPLEMENTO}}</div>
<div>{{LEGAL}}</div>

<div class="rodape">
  <div class="info" id="uf">UF: {{UF}}</div>
  <div class="info" id="urn">URN: {{URN}}</div>
  <div class="info" id="seg">Negócio do Cliente: {{SEGMENTO}}</div>
</div>

</div>

<script>
function hide(id,val){
 if(!val || val.includes("{{")){
   const el = document.getElementById(id);
   if(el) el.style.display="none";
 }
}

hide("uf","{{UF}}");
hide("urn","{{URN}}");
hide("seg","{{SEGMENTO}}");
</script>

</body>
</html>
