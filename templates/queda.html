<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<style>
* {
  box-sizing: border-box;
  text-transform: uppercase;
  font-family: 'Inter';
  color: #1F3C6E;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 700px;
  height: 1058px;
  background: #fff;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* CENTRO */
.texto-topo { font-size: 26px; text-align:center; }
.valor-texto { font-size: 200px; font-weight:900; text-align:center; }

.complemento { text-align:center; }
.legal { text-align:center; }

/* RODAPÉ */
.rodape {
  text-align: center;
}

.info {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="card">

<div class="texto-topo">{{TEXTO}}</div>

<div class="valor-texto">{{VALOR}}%</div>

<div class="complemento">{{COMPLEMENTO}}</div>
<div class="legal">{{LEGAL}}</div>

<div class="rodape">
  <div class="info" id="uf">UF: {{UF}}</div>
  <div class="info" id="urn">URN: {{URN}}</div>
  <div class="info" id="seg">Negócio do Cliente: {{SEGMENTO}}</div>
</div>

</div>

<script>
function hide(id,val){
 if(!val || val.includes("{{")){
   const el = document.getElementById(id);
   if(el) el.style.display="none";
 }
}
hide("uf","{{UF}}");
hide("urn","{{URN}}");
hide("seg","{{SEGMENTO}}");
</script>

</body>
</html>
