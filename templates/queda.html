<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=700, initial-scale=1.0" />
<title>Queda de Preço</title>

<style>

@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf');
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Black.ttf');
  font-weight: 900;
}

* {
  box-sizing: border-box;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  color: #1F3C6E;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent;
}

/* 🔥 CORREÇÃO DEFINITIVA */
.card {
  width: 700px;
  height: 1058px;

  border-radius: 40px;
  border: 10px solid #E0B84B;

  background: #ffffff;

  /* ESSENCIAL */
  overflow: hidden;

  /* 🔥 ISSO É O QUE FALTAVA */
  background-clip: content-box;

  padding: 60px 40px 40px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* TOPO */
.topo {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo img {
  max-width: 240px;
  max-height: 120px;
}

.tarja {
  background: #1a7d00;
  color: #ffffff;
  font-weight: 700;
  font-size: 42px;
  text-align: center;
  padding: 18px 40px;
  border-radius: 999px;
  margin-bottom: 30px;
}

/* CENTRO */
.area-central {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}

.texto-topo {
  font-size: 26px;
  text-align: center;
}

.valor-texto {
  font-weight: 900;
  font-size: clamp(140px, 22vw, 260px);
}

.desconto {
  font-size: 44px;
  font-weight: 700;
}

.complemento {
  font-size: 24px;
  text-align: center;
}

.legal {
  font-size: 18px;
  text-align: center;
}

/* RODAPÉ */
.rodape {
  text-align: center;
}

.info {
  font-size: 18px;
  line-height: 1.2;
}

</style>
</head>

<body>

<div class="card">

  <div class="topo">
    <div class="logo">
      <img src="{{LOGO}}">
    </div>

    <div class="tarja">
      QUEDA DE PREÇO
    </div>
  </div>

  <div class="area-central">

    <div class="texto-topo">
      {{TEXTO}}
    </div>

    <div class="valor-texto">
      {{VALOR}}%
    </div>

    <div class="desconto">
      DE DESCONTO
    </div>

    <div class="complemento">
      {{COMPLEMENTO}}
    </div>

    <div class="legal">
      {{LEGAL}}
    </div>

  </div>

  <div class="rodape">
    <div class="info" id="uf">UF: {{UF}}</div>
    <div class="info" id="urn">URN: {{URN}}</div>
    <div class="info" id="seg">Negócio do Cliente: {{SEGMENTO}}</div>
  </div>

</div>

<script>
function hide(id,val){
 if(!val || val.includes("{{")){
   const el = document.getElementById(id);
   if(el) el.style.display="none";
 }
}

hide("uf","{{UF}}");
hide("urn","{{URN}}");
hide("seg","{{SEGMENTO}}");
</script>

</body>
</html>
