<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<style>
body { margin:0; display:flex; justify-content:center; align-items:center; }
.card { width:700px; height:1058px; background:#fff; padding:40px; display:flex; flex-direction:column; justify-content:space-between; }

.texto-topo { font-size:26px; text-align:center; }
.valor-texto { font-size:200px; font-weight:900; text-align:center; }

.rodape { text-align:center; display:flex; flex-direction:column; gap:6px; }
.info { font-size:16px; }
</style>
</head>

<body>

<div class="card">

<div class="texto-topo">{{TEXTO}}</div>

<div class="valor-texto">{{VALOR}}</div>

<div>{{COMPLEMENTO}}</div>
<div>{{LEGAL}}</div>

<div class="rodape">
  <div class="info" id="uf">UF: {{UF}}</div>
  <div class="info" id="urn">URN: {{URN}}</div>
  <div class="info" id="seg">Negócio do Cliente: {{SEGMENTO}}</div>
</div>

</div>

<script>
function hide(id,val){
 if(!val || val.includes("{{")) document.getElementById(id).style.display="none";
}
hide("uf","{{UF}}");
hide("urn","{{URN}}");
hide("seg","{{SEGMENTO}}");
</script>

</body>
</html>
