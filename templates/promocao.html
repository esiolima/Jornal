<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=700, initial-scale=1.0" />
<title>Promoção</title>

<style>
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Black.ttf') format('truetype');
  font-weight: 900;
}

* {
  text-transform: uppercase;
  color: #2b4474;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* ================= CARD ================= */
.card {
  width: 700px;
  height: 1058px;
  border: 8px solid #e0b84b;
  border-radius: 40px;
  padding: 70px 40px 40px 40px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #ffffff;
}

/* ===== SELO DINÂMICO ===== */
.selo {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 130px;
  height: 65px;
  z-index: 999;
  display: none;
}

.selo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ===== TOPO ===== */
.topo {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

.logo img {
  max-width: 220px;
  max-height: 120px;
  margin-bottom: 25px;
}

.tarja {
  background: #ff7a00;
  color: #ffffff;
  padding: 20px 70px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 54px;
  text-align: center;
}

/* ===== BLOCO CENTRAL ===== */
.bloco-central {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-grow: 1;
  justify-content: center;
  width: 100%;
  overflow: hidden;
}

.texto-topo {
  text-align: center;
  font-size: 28px;
  max-width: 550px;
  line-height: 1.15;
  margin-bottom: 10px;
}

.valor-container {
  width: 100%;
  height: 400px; /* Espaço para o valor */
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.valor-texto {
  font-weight: 900;
  font-size: 480px;
  line-height: 0.85;
  text-align: center;
  width: 100%;
  
  /* Lógica de hifenização */
  word-wrap: break-word;
  overflow-wrap: break-word;
  hyphens: auto; 
  -webkit-hyphens: auto;
}

/* ===== BLOCO INFERIOR ===== */
.bloco-inferior {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.complemento { font-size: 22px; text-align: center; }
.legal { font-size: 18px; text-align: center; max-width: 600px; }
.rodape { text-align: center; margin-bottom: 10px; }
.uf { font-size: 22px; font-weight: 700; }
.segmento-wrapper { font-size: 18px; margin-top: 5px; }

</style>
</head>

<body>

<div class="card" lang="pt-br">
  <div class="selo" id="selo-container">
    <img id="selo-img" />
  </div>

  <div class="topo">
    <div class="logo"><img src="{{LOGO}}" /></div>
    <div class="tarja">PROMOÇÃO</div>
  </div>

  <div class="bloco-central">
    <div class="texto-topo">{{TEXTO}}</div>
    <div class="valor-container" id="valor-container">
      <div class="valor-texto" id="valor-texto">
        {{VALOR}}
      </div>
    </div>
  </div>

  <div class="bloco-inferior">
    <div class="complemento">{{COMPLEMENTO}}</div>
    <div class="legal">{{LEGAL}}</div>
    <div class="rodape">
      <div class="uf">{{URN}}</div>
      <div class="uf">{{UF}}</div>
      <div id="segmento-bloco" class="segmento-wrapper">
        NEGOCIO DE CLIENTES: {{SEGMENTO}}
      </div>
    </div>
  </div>
</div>

<script>
window.addEventListener("load", function () {
  const container = document.getElementById("valor-container");
  const texto = document.getElementById("valor-texto");

  if (container && texto) {
    let fontSize = 480;
    texto.style.fontSize = fontSize + "px";

    // O loop agora verifica se o texto transborda o container.
    // Com 'hyphens: auto', o navegador tentará quebrar com hífen antes de reduzir a fonte drasticamente.
    while (
      (texto.scrollHeight > container.offsetHeight || texto.offsetWidth > container.offsetWidth) &&
      fontSize > 40
    ) {
      fontSize -= 8;
      texto.style.fontSize = fontSize + "px";
    }
  }

  // Lógica de Segmento
  const segmento = document.getElementById("segmento-bloco");
  const valSeg = "{{SEGMENTO}}".trim();
  if ((!valSeg || valSeg === "" || valSeg.includes("{{")) && segmento) {
    segmento.style.display = "none";
  }

  // Lógica de Selo
  const seloCont = document.getElementById("selo-container");
  const seloImg = document.getElementById("selo-img");
  const valSelo = "{{SELO}}".trim();
  if (valSelo && valSelo !== "" && !valSelo.includes("{{")) {
    seloImg.src = valSelo;
    seloCont.style.display = "block";
  }
});
</script>

</body>
</html>
