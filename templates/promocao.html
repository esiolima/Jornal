<div class="card">

  <div class="selo" data-selo="{{SELO}}">
    <img />
  </div>

  <div class="topo">
    <div class="logo">
      <img src="{{LOGO}}" />
    </div>

    <div class="tarja">
      PROMOÇÃO
    </div>
  </div>

  <div class="area-central">

    <div class="texto-topo">
      {{TEXTO}}
    </div>

    <div class="valor-container">
      <div class="valor-texto">
        {{VALOR}}
      </div>
    </div>

    <div class="complemento">
      {{COMPLEMENTO}}
    </div>

    <div class="legal">
      {{LEGAL}}
    </div>

  </div>

  <div class="rodape">
    <div class="uf">{{URN}}</div>
    <div class="uf">{{UF}}</div>

    <div class="segmento-wrapper" data-segmento="{{SEGMENTO}}">
      SEGMENTO DE CLIENTES: {{SEGMENTO}}
    </div>
  </div>

</div>
