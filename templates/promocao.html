<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=700, initial-scale=1.0" />
<title>Promoção</title>

<style>





* {
  box-sizing: border-box;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  color: #1F3C6E;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent;
}

/* 🔥 PADRÃO FINAL DA BORDA */
.card {
  width: 700px;
  height: 1058px;

  border-radius: 40px;
  border: 10px solid #E0B84B;

  background-color: #ffffff;

  /* CORREÇÃO DO PROBLEMA */
  overflow: hidden;

  padding: 60px 40px 40px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  position: relative;
}

/* TOPO */
.topo {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo img {
  max-width: 240px;
  max-height: 120px;
}

.tarja {
  background: #ff8c00;
  color: #ffffff;
  font-weight: 700;
  font-size: 42px;
  padding: 18px 40px;
  border-radius: 999px;
  margin-bottom: 30px;
}

/* CENTRO */
.area-central {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.texto-topo {
  font-size: 26px;
  text-align: center;
  max-width: 560px;
}

.valor-texto {
  font-weight: 900;
  font-size: 260px;
  line-height: 0.9;
}

.complemento {
  font-size: 24px;
  text-align: center;
}

.legal {
  font-size: 18px;
  text-align: center;
}

/* RODAPÉ */
.rodape {
  text-align: center;
}

.info {
  font-size: 18px;
  line-height: 1.2;
}

</style>
</head>

<body>

<div class="card">

  <div class="topo">
    <div class="logo">
      <img src="{{LOGO}}">
    </div>

    <div class="tarja">PROMOÇÃO</div>
  </div>

  <div class="area-central">

    <div class="texto-topo">{{TEXTO}}</div>

    <div class="valor-texto">{{VALOR}}</div>

    <div class="complemento">{{COMPLEMENTO}}</div>

    <div class="legal">{{LEGAL}}</div>

  </div>

  <div class="rodape">
    <div class="info" id="uf">UF: {{UF}}</div>
    <div class="info" id="urn">URN: {{URN}}</div>
    <div class="info" id="seg">Negócio do Cliente: {{SEGMENTO}}</div>
  </div>

</div>

<script>
// esconder campos vazios
function hide(id,val){
 if(!val || val.includes("{{")){
   const el = document.getElementById(id);
   if(el) el.style.display="none";
 }
}

hide("uf","{{UF}}");
hide("urn","{{URN}}");
hide("seg","{{SEGMENTO}}");
</script>

</body>
</html>
