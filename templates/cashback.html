<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=700, initial-scale=1.0" />
<title>Cashback</title>

<style>
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf');
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Black.ttf');
  font-weight: 900;
}

* {
  box-sizing: border-box;
  text-transform: uppercase;
  font-family: 'Inter';
  color: #1F3C6E;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 700px;
  height: 1058px;
  border: 8px solid #e0b84b;
  border-radius: 40px;
  background: #fff;
  padding: 60px 40px 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}

/* TOPO */
.topo {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo img {
  max-width: 240px;
  max-height: 120px;
}

.tarja {
  background: #d200da;
  color: #fff;
  font-size: 42px;
  padding: 18px 40px;
  border-radius: 999px;
  margin-top: 20px;
}

/* CENTRO */
.area-central {
  text-align: center;
}

.valor-texto {
  font-size: clamp(140px, 22vw, 260px);
  font-weight: 900;
}

/* RODAPÉ */
.rodape {
  text-align: center;
}

.info {
  font-size: 18px;
  line-height: 1.2;
}
</style>
</head>

<body>

<div class="card">

<div class="topo">
  <div class="logo"><img src="{{LOGO}}"></div>
  <div class="tarja">CASHBACK</div>
</div>

<div class="area-central">
  <div>{{TEXTO}}</div>
  <div class="valor-texto">{{VALOR}}%</div>
  <div>DE DESCONTO</div>
  <div>{{COMPLEMENTO}}</div>
  <div>{{LEGAL}}</div>
</div>

<div class="rodape">
  <div class="info" id="uf">UF: {{UF}}</div>
  <div class="info" id="urn">URN: {{URN}}</div>
  <div class="info" id="seg">Negócio do Cliente: {{SEGMENTO}}</div>
</div>

</div>

<script>
function hide(id,val){
 if(!val || val.includes("{{")){
   const el = document.getElementById(id);
   if(el) el.style.display="none";
 }
}
hide("uf","{{UF}}");
hide("urn","{{URN}}");
hide("seg","{{SEGMENTO}}");

// SELO
const selo = "{{SELO}}";
if (selo && selo !== "{{SELO}}") {
  document.getElementById("selo-img").src = selo;
}
</script>

</body>
</html>
